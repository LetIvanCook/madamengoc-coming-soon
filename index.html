<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madame Ngọc — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Màu nền đỏ rượu vang tối đồng bộ với vùng tối của ảnh[cite: 3] */
            background-color: #21070b;
            background-image: radial-gradient(circle at center, #3b0d14 0%, #180407 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
            color: #e6d5d7;
        }

        .showcase-wrapper {
            position: relative;
            width: 100%;
            max-width: 540px;
            height: 100vh;
            max-height: 860px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInScale 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        .envelope-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Làm mềm 4 cạnh ảnh để hòa quyện tự nhiên vào nền tối */
            -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, black 55%, transparent 100%);
            mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, black 55%, transparent 100%);
        }

        .brand-footer {
            position: fixed;
            bottom: 24px;
            text-align: center;
            letter-spacing: 0.25em;
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.65;
            z-index: 10;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.97);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 600px) {
            .showcase-wrapper {
                max-width: 100%;
                max-height: 100vh;
            }
            .envelope-img {
                -webkit-mask-image: none;
                mask-image: none;
            }
        }
    </style>
</head>
<body>
    <main class="showcase-wrapper">
        <img src="envelope.jpg" alt="Madame Ngọc — Coming Soon" class="envelope-img">
    </main>

    <footer class="brand-footer">
        Madamengoc.vn
    </footer>
</body>
</html>
